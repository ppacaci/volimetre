<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>volimetre — Kredi Hesaplama</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 32px));margin:auto;padding:48px 0}header{margin-bottom:70px}.brand{font-size:24px;font-weight:800}.tag{color:var(--muted);font-size:14px;margin-top:6px}.result{text-align:center}.result h1{font-size:42px;letter-spacing:-2px;margin:0}.total{color:var(--muted);margin:8px 0 28px}.selectors{display:flex;justify-content:center;gap:8px;flex-wrap:wrap}.selector{border:1px solid var(--line);background:#fff;padding:11px 14px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}.selector.active{background:#111;color:#fff}.panel{display:none;margin:10px auto 0;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;gap:6px;flex-wrap:wrap;justify-content:center}.panel.open{display:flex}.panel button{border:1px solid var(--line);background:#fff;padding:8px 10px;border-radius:8px;font-size:12px;cursor:pointer}.panel button.active{background:#111;color:#fff}.note{margin-top:28px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center}footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);text-align:center}footer a{color:inherit}@media(max-width:560px){main{padding-top:34px}.result h1{font-size:34px}} </style></head><body><main><header><div class="brand">volimetre</div><div class="tag">Kredi hesaplamanın en kısa yolu.</div></header><section class="result"><h1 id="monthly"></h1><div class="total">Toplam ödeme <b id="total"></b></div><div class="selectors"><button class="selector" onclick="toggle('amountPanel')" id="amountBtn"></button><button class="selector" onclick="toggle('termPanel')" id="termBtn"></button><button class="selector" onclick="toggle('ratePanel')" id="rateBtn"></button></div><div class="panel" id="amountPanel"></div><div class="panel" id="termPanel"></div><div class="panel" id="ratePanel"></div><div class="note">Hesaplama eşit taksitli kredi formülüyle yaklaşık olarak yapılır. Gerçek ödeme planı bankaya göre değişebilir.</div></section><footer>volimetre · <a href="https://websitenyokmu.com.tr" target="_blank" rel="noopener noreferrer">websitenyokmu.com.tr</a> tarafından geliştirildi.</footer></main><script>let amount=100000,term=24,rate=2.99;const amounts=[50000,75000,90000,100000,110000,125000,250000],terms=[12,18,24,30,36,48],rates=[2.49,2.79,2.99,3.19,3.49];const money=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n),pay=(p,r,n)=>{r/=100;return p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};function toggle(id){document.querySelectorAll('.panel').forEach(x=>x.id===id?x.classList.toggle('open'):x.classList.remove('open'))}function choose(type,v){if(type==='a')amount=v;if(type==='t')term=v;if(type==='r')rate=v;document.querySelectorAll('.panel').forEach(x=>x.classList.remove('open'));render()}function render(){let q=pay(amount,rate,term);document.getElementById('monthly').textContent=money(q)+' / ay';document.getElementById('total').textContent=money(q*term);document.getElementById('amountBtn').textContent=money(amount);document.getElementById('termBtn').textContent=term+' AY';document.getElementById('rateBtn').textContent='%'+rate.toFixed(2).replace('.',',');document.getElementById('amountPanel').innerHTML=amounts.map(x=>'<button class="'+(x===amount?'active':'')+'" onclick="choose('a','+x+')">'+money(x)+'</button>').join('');document.getElementById('termPanel').innerHTML=terms.map(x=>'<button class="'+(x===term?'active':'')+'" onclick="choose('t','+x+')">'+x+' AY</button>').join('');document.getElementById('ratePanel').innerHTML=rates.map(x=>'<button class="'+(x===rate?'active':'')+'" onclick="choose('r','+x+')">%'+x.toFixed(2).replace('.',',')+'</button>').join('')}render()</script></body></html>
