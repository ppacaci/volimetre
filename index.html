<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>volimetre — Kredi Hesaplama</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 32px));margin:auto;padding:44px 0}.brand{font-size:24px;font-weight:800}.tag{color:var(--muted);font-size:14px;margin-top:5px}header{margin-bottom:52px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:12px}.card.main{padding:30px 22px}.monthly{font-size:34px;font-weight:800;letter-spacing:-1px}.card.main .monthly{font-size:42px}.total{color:var(--muted);margin:5px 0 18px}.fields{display:flex;gap:7px;flex-wrap:wrap}.field{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:9px;font-size:13px;cursor:pointer}.panel{display:none;margin-top:8px;gap:5px;flex-wrap:wrap}.panel.open{display:flex}.panel button{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:8px;font-size:12px}.panel button.active{background:#111;color:#fff}.diff{font-size:11px;color:var(--muted);margin:8px 0}.label{font-size:11px;color:var(--muted);margin-bottom:8px}.remove{position:absolute;right:10px;top:8px;border:0;background:none;color:#999;font-size:16px;cursor:pointer}.add.hidden{display:none}.addbox{position:relative;display:flex;justify-content:center;margin:22px auto;width:360px;height:128px}.add.hidden{display:none}.add{position:absolute;z-index:2;top:42px;width:42px;height:42px;border-radius:50%;font-size:25px;padding:0}.suggestions{position:absolute;inset:0;display:none;justify-content:space-between;flex-direction:column;padding:0}.suggestions.open{display:flex}.suggest-row{display:flex;justify-content:space-between;gap:4px;opacity:.58}.suggest-row button{min-width:58px}.suggestions{display:none;gap:4px;f ton data-i="0" data-type="r" data-value="2.79">%2,79</button><button data-i="0" data-type="r" data-value="2.99" class="active">%2,99</button><button data-i="0" data-type="r" data-value="3.19">%3,19</button><button data-i="0" data-type="r" data-value="3.49">%3,49</button></div></section><div class="addbox"><button class="add">+</button><div class="suggestions"></div></div></div><footer>volimetre · <a href="https://websitenyokmu.com.tr" target="_blank" rel="noopener noreferrer">websitenyokmu.com.tr</a> tarafından geliştirildi.</footer></main><script>var scenarios=[{a:100000,t:24,r:2.99}];var amounts=[50000,75000,90000,100000,110000,125000,250000],terms=[12,18,24,30,36,48],rates=[2.49,2.79,2.99,3.19,3.49];var money=function(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n)},pay=function(p,r,n){r/=100;return p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};function render(){var root=document.getElementById('cards');root.innerHTML='';scenarios.forEach(function(s,i){var q=pay(s.a,s.r,s.t),card=document.createElement('section');card.className='card '+(i===0?'main':'');card.innerHTML=(i?'':'')+'<div class="label">'+(i?'KARŞILAŞTIRMA '+i:'ANA SONUÇ')+'</div><div class="monthly">'+money(q)+' / ay</div><div class="total">Toplam '+money(q*s.t)+'</div><div class="fields"></div><div class="panel"></div>' ;var fields=card.querySelector('.fields'),panel=card.querySelector('.panel');[['a',money(s.a)],['t',s.t+' AY'],['r','%'+s.r.toFixed(2).replace('.',',')]].forEach(function(x){var b=document.createElement('button');b.className='field';b.textContent=x[1];b.dataset.type=x[0];fields.appendChild(b)});var rows=[[-20000,-10000,-5000,5000,10000,20000],[-6,-3,-1,1,3,6],[-.10,-.05,.05,.10]];rows.forEach(function(row,k){var line=document.createElement('div');line.className='suggest-row';row.forEach(function(d){var b=document.createElement('button');b.textContent=k===0?money(s.a+d):k===1?(s.t+d)+' AY':'%'+(s.r+d).toFixed(2).replace('.',',');b.dataset.k=k;b.dataset.d=d;line.appendChild(b)});panel.appendChild(line)});var add=document.createElement('button');add.className='add';add.textContent='+';var box=document.createElement('div');box.className='addbox';box.appendChild(add);root.appendChild(card);if(i===0)root.appendChild(box);add.onclick=function(){add.style.display='none';panel.classList.add('open')};fields.addEventListener('click',function(e){var b=e.target.closest('.field');if(!b)return;panel.classList.add('open')});panel.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;var n={a:s.a,t:s.t,r:s.r},d=Number(b.dataset.d);if(b.dataset.k==='0')n.a=Math.max(5000,s.a+d);if(b.dataset.k==='1')n.t=Math.max(1,s.t+d);if(b.dataset.k==='2')n.r=Math.max(.01,Number((s.r+d).toFixed(2)));scenarios.push(n);render()})})}document.addEventListener('click',function(e){if(e.target.closest('.addbox')||e.target.closest('.panel')||e.target.closest('.field'))return;document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open')});document.querySelectorAll('.add').forEach(function(b){b.style.display='block'})});render();</script>
