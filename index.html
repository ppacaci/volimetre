<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>volimetre — Kredi Hesaplama</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 32px));margin:auto;padding:48px 0}.brand{font-size:24px;font-weight:800}.tag,.total,.note,footer{color:var(--muted)}header{margin-bottom:70px}.result{text-align:center}.result h1{font-size:42px;margin:0 0 8px}.selectors{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-top:28px}.selector,.panel button{border:1px solid var(--line);background:#fff;padding:10px 13px;border-radius:9px;font:inherit;font-size:13px;cursor:pointer}.panel{display:none;margin:10px auto;padding:10px;background:#fff;border:1px solid var(--line);border-radius:12px;gap:6px;flex-wrap:wrap;justify-content:center}.panel.open{display:flex}.panel button.active{background:#111;color:#fff}.note{margin-top:28px;font-size:12px;line-height:1.5}footer{margin-top:70px;padding-top:20px;border-top:1px solid var(--line);font-size:12px;text-align:center}footer a{color:inherit}@media(max-width:560px){.result h1{font-size:34px}}</style></head><body><main><header><div class="brand">volimetre</div><div class="tag">Kredi hesaplamanın en kısa yolu.</div></header><section class="result"><h1 id="monthly"></h1><div class="total">Toplam ödeme <b id="total"></b></div><div class="selectors"><button class="selector" id="amountBtn"></button><button class="selector" id="termBtn"></button><button class="selector" id="rateBtn"></button></div><div class="panel" id="amountPanel"></div><div class="panel" id="termPanel"></div><div class="panel" id="ratePanel"></div><div class="note">Hesaplama eşit taksitli kredi formülüyle yaklaşık olarak yapılır. Gerçek ödeme planı bankaya göre değişebilir.</div></section><footer>volimetre · <a href="https://websitenyokmu.com.tr" target="_blank" rel="noopener noreferrer">websitenyokmu.com.tr</a> tarafından geliştirildi.</footer></main><script>var amount=100000,term=24,rate=2.99,openPanel=null;var amounts=[50000,75000,90000,100000,110000,125000,250000],terms=[12,18,24,30,36,48],rates=[2.49,2.79,2.99,3.19,3.49];var money=function(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n)};var pay=function(p,r,n){r=r/100;return p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};var closePanels=function(){document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open')})};var button=function(value,label,type){var b=document.createElement('button');b.textContent=label;b.dataset.type=type;b.dataset.value=value;if((type==='a'&&value===amount)||(type==='t'&&value===term)||(type==='r'&&value===rate))b.className='active';return b};var render=function(){var q=pay(amount,rate,term);document.getElementById('monthly').textContent=money(q)+' / ay';document.getElementById('total').textContent=money(q*term);document.getElementById('amountBtn').textContent=money(amount);document.getElementById('termBtn').textContent=term+' AY';document.getElementById('rateBtn').textContent='%'+rate.toFixed(2).replace('.',',');var ap=document.getElementById('amountPanel'),tp=document.getElementById('termPanel'),rp=document.getElementById('ratePanel');ap.innerHTML='';tp.innerHTML='';rp.innerHTML='';amounts.forEach(function(x){ap.appendChild(button(x,money(x),'a'))});terms.forEach(function(x){tp.appendChild(button(x,x+' AY','t'))});rates.forEach(function(x){rp.appendChild(button(x,'%'+x.toFixed(2).replace('.',','),'r'))});var add=function(p,v,label,type){p.appendChild(button(v,label,type))};add(ap,amount-25000,'−25K','a');add(ap,amount-5000,'−5K','a');add(ap,amount+5000,'+5K','a');add(ap,amount+25000,'+25K','a');add(tp,Math.max(1,term-6),'−6','t');add(tp,Math.max(1,term-1),'−1','t');add(tp,term+1,'+1','t');add(tp,term+6,'+6','t');add(rp,Math.max(0.01,rate-0.10),'−0,10','r');add(rp,Math.max(0.01,rate-0.01),'−0,01','r');add(rp,rate+0.01,'+0,01','r');add(rp,rate+0.10,'+0,10','r');[ap,tp,rp].forEach(function(p){var b=document.createElement('button');b.textContent='✓';b.dataset.close='1';p.appendChild(b)});if(openPanel)document.getElementById(openPanel).classList.add('open')};document.querySelectorAll('.selector').forEach(function(b){b.addEventListener('click',function(){var p=document.getElementById(b.id.replace('Btn','Panel'));var open=p.classList.contains('open');closePanels();if(!open){p.classList.add('open');openPanel=p.id}else{openPanel=null}})});document.querySelectorAll('.panel').forEach(function(p){p.addEventListener('click',function(e){if(e.target.tagName!=='BUTTON')return;if(e.target.dataset.close){p.classList.remove('open');openPanel=null;return}var pWasOpen=p.classList.contains('open');var v=Number(e.target.dataset.value);if(e.target.dataset.type==='a')amount=v;if(e.target.dataset.type==='t')term=v;if(e.target.dataset.type==='r')rate=v;render();if(pWasOpen)p.classList.add('open')})});document.addEventListener('click',function(e){if(e.target.dataset&&e.target.dataset.type)return;if(!e.target.closest('.selector')&&!e.target.closest('.panel')){closePanels();openPanel=null}});render();</script></body></html>
