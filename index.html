<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Volimetre — Kredi Hesaplama</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{width:min(760px,calc(100% - 32px));margin:auto;padding:54px 0 32px}.brand{font-size:24px;font-weight:800}.tag,.note,footer,p{color:var(--muted)}section{margin:30px 0}h2{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}.choices{display:flex;flex-wrap:wrap;gap:9px}button{border:1px solid var(--line);background:#fff;padding:12px 15px;border-radius:10px;font:inherit;font-weight:650;cursor:pointer}button.active{background:#111;color:#fff}.summary{margin-top:36px;padding-top:27px;border-top:1px solid var(--line)}h1{font-size:28px}.results{margin-top:22px;border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.row{display:grid;grid-template-columns:1fr 1.2fr 1.2fr;gap:12px;padding:17px 18px;border-bottom:1px solid var(--line)}.row:last-child{border:0}.label{display:block;font-size:11px;color:var(--muted)}.value,.rate{font-weight:700}.note{font-size:12px;line-height:1.55;margin-top:18px}footer{margin-top:65px;padding-top:20px;border-top:1px solid var(--line);font-size:12px}@media(max-width:560px){.row{grid-template-columns:1fr 1fr}.rate{grid-column:1/-1}}</style></head><body><main><header><div class="brand">volimetre</div><div class="tag">Kredi hesaplamanın en kısa yolu.</div></header><section><h2>Kredi tutarı</h2><div class="choices" id="amounts"></div><div class="choices" id="adjustments"></div></section><section><h2>Vade</h2><div class="choices" id="terms"></div></section><div class="summary"><h1 id="title"></h1><p>Farklı aylık faiz oranlarında yaklaşık ödeme tutarları.</p><div class="results" id="results"></div><div class="note">Hesaplamalar eşit taksitli kredi formülüyle yaklaşık olarak yapılır. Gerçek ödeme planı farklılık gösterebilir.</div></div><footer>volimetre · <a href="https://websitenyokmu.com.tr" rel="noopener noreferrer">websitenyokmu.com.tr</a> tarafından geliştirildi.</footer></main><script>const A=[10000,50000,100000,250000,500000],T=[12,24,36,48],R=[2.49,2.99,3.49,3.99,4.49];let a=100000,t=24;const m=n=>new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n),s=n=>n>=1e6?'1 MİLYON':n/1000+' BİN',pay=(p,r,n)=>{r/=100;return p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};function render(){amounts.innerHTML=A.map(x=>'<button class="'+(x==a?'active':'')+'" onclick="a='+x+';render()">'+s(x)+'</button>').join('');terms.innerHTML=T.map(x=>'<button class="'+(x==t?'active':'')+'" onclick="t='+x+';render()">'+x+' AY</button>').join('');title.textContent=m(a)+' · '+t+' Ay';results.innerHTML=R.map(r=>{let q=pay(a,r,t);return '<div class="row"><div class="rate">%'+r+' faiz</div><div><span class="label">AYLIK TAKSİT</span><span class="value">'+m(q)+'</span></div><div><span class="label">TOPLAM ÖDEME</span><span class="value">'+m(q*t)+'</span></div></div>'}).join('')}render()</script></body></html>
