<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>volimetre — Kredi Hesaplama</title><style>:root{--bg:#f7f7f5;--card:#fff;--text:#151515;--muted:#777;--line:#e7e7e3}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,sans-serif}main{width:min(620px,calc(100% - 32px));margin:auto;padding:44px 0}.brand{font-size:24px;font-weight:800}.tag{color:var(--muted);font-size:14px;margin-top:5px}header{margin-bottom:52px}.card{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;margin-bottom:12px}.card.main{padding:30px 22px}.monthly{font-size:34px;font-weight:800;letter-spacing:-1px}.card.main .monthly{font-size:42px}.total{color:var(--muted);margin:5px 0 18px}.fields{display:flex;gap:7px;flex-wrap:wrap}.field{border:1px solid var(--line);background:#fff;padding:9px 11px;border-radius:9px;font-size:13px;cursor:pointer}.panel{display:none;margin-top:8px;gap:5px;flex-wrap:wrap}.panel.open{display:flex}.panel button{border:1px solid var(--line);background:#fff;padding:7px 9px;border-radius:8px;font-size:12px}.panel button.active{background:#111;color:#fff}.diff{font-size:11px;color:var(--muted);margin:8px 0}.label{font-size:11px;color:var(--muted);margin-bottom:8px}.remove{position:absolute;right:10px;top:8px;border:0;background:none;color:#999;font-size:16px;cursor:pointer}.add.hidden{display:none}.addbox{position:relative;display:flex;justify-content:center;margin:22px auto;width:360px;height:128px}.add{position:absolute;z-index:2;top:42px;width:42px;height:42px;border-radius:50%;font-size:25px;padding:0}.suggestions{position:absolute;inset:0;display:none;justify-content:space-between;flex-direction:column;padding:0}.suggestions.open{display:flex}.suggest-row{display:flex;justify-content:space-between;gap:4px;opacity:.58}.suggest-row button{min-width:58px}.suggestions{display:none;gap:4px;flex-direction:column}.suggestions.open{display:flex}.suggest-row{display:flex;gap:4px;opacity:.55}.suggest-row button{border:1px solid var(--line);background:#fff;border-radius:7px;padding:5px 7px;font-size:11px}.add{display:block;margin:12px auto;border:1px solid var(--line);background:#fff;border-radius:50%;width:34px;height:34px;font-size:22px;cursor:pointer}footer{margin-top:55px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:12px;text-align:center}footer a{color:inherit}</style></head><body><main><header><div class="brand">volimetre</div><div class="tag">Kredi hesaplamanın en kısa yolu.</div></header><div id="cards"><section class="card main"><div class="label">ANA SONUÇ</div><div class="monthly">₺5.898 / ay</div><div class="total">Toplam ₺141.561</div><div class="fields"><button class="field" data-i="0" data-type="a">₺100.000</button><button class="field" data-i="0" data-type="t">24 AY</button><button class="field" data-i="0" data-type="r">%2,99</button></div><div class="panel" id="p0"><button data-i="0" data-type="a" data-value="50000">₺50.000</button><button data-i="0" data-type="a" data-value="75000">₺75.000</button><button data-i="0" data-type="a" data-value="90000">₺90.000</button><button data-i="0" data-type="a" data-value="100000" class="active">₺100.000</button><button data-i="0" data-type="a" data-value="110000">₺110.000</button><button data-i="0" data-type="a" data-value="125000">₺125.000</button><button data-i="0" data-type="a" data-value="250000">₺250.000</button><button data-i="0" data-type="t" data-value="12">12 AY</button><button data-i="0" data-type="t" data-value="18">18 AY</button><button data-i="0" data-type="t" data-value="24" class="active">24 AY</button><button data-i="0" data-type="t" data-value="30">30 AY</button><button data-i="0" data-type="t" data-value="36">36 AY</button><button data-i="0" data-type="t" data-value="48">48 AY</button><button data-i="0" data-type="r" data-value="2.49">%2,49</button><button data-i="0" data-type="r" data-value="2.79">%2,79</button><button data-i="0" data-type="r" data-value="2.99" class="active">%2,99</button><button data-i="0" data-type="r" data-value="3.19">%3,19</button><button data-i="0" data-type="r" data-value="3.49">%3,49</button></div></section><div class="addbox"><button class="add">+</button><div class="suggestions"></div></div></div><footer>volimetre · <a href="https://websitenyokmu.com.tr" target="_blank" rel="noopener noreferrer">websitenyokmu.com.tr</a> tarafından geliştirildi.</footer></main><script>var scenarios=[{a:100000,t:24,r:2.99}],open=null;var amounts=[50000,75000,90000,100000,110000,125000,250000],terms=[12,18,24,30,36,48],rates=[2.49,2.79,2.99,3.19,3.49];var money=function(n){return new Intl.NumberFormat('tr-TR',{style:'currency',currency:'TRY',maximumFractionDigits:0}).format(n)},pay=function(p,r,n){r/=100;return p*r*Math.pow(1+r,n)/(Math.pow(1+r,n)-1)};var vals=function(i,type){return type==='a'?amounts:type==='t'?terms:rates};var render=function(){var root=document.getElementById('cards');root.innerHTML='';scenarios.forEach(function(s,i){var q=pay(s.a,s.r,s.t),card=document.createElement('section');card.className='card '+(i===0?'main':'');card.innerHTML=(i===0?'':'<button class="remove" data-remove="'+i+'">×</button>')+'<div class="label">'+(i===0?'ANA SONUÇ':'KARŞILAŞTIRMA '+i)+'</div><div class="monthly">'+money(q)+' / ay</div><div class="total">Toplam '+money(q*s.t)+'</div><div class="fields"><button class="field" data-i="'+i+'" data-type="a">'+money(s.a)+'</button><button class="field" data-i="'+i+'" data-type="t">'+s.t+' AY</button><button class="field" data-i="'+i+'" data-type="r">%'+s.r.toFixed(2).replace('.',',')+'</button></div><div class="panel" id="p'+i+'"></div>';if(i>0){var main=scenarios[0],d1=document.createElement('div'),mainQ=pay(main.a,main.r,main.t),monthlyDiff=q-mainQ,totalDiff=q*s.t-mainQ*main.t;d1.className='diff';d1.style.color=s.a===main.a?(monthlyDiff<=0?'#16803c':'#c62828'):'#777';d1.textContent='Ana hesaba göre: aylık '+money(monthlyDiff)+' · toplam '+money(totalDiff);card.appendChild(d1)}root.appendChild(card);['a','t','r'].forEach(function(type){var p=card.querySelector('.panel');vals(i,type).forEach(function(v){var b=document.createElement('button');b.textContent=type==='a'?money(v):type==='t'?v+' AY':'%'+v.toFixed(2).replace('.',',');b.dataset.i=i;b.dataset.type=type;b.dataset.value=v;if(s[type]===v)b.className='active';p.appendChild(b)})})});var addbox=document.createElement('div');addbox.className='addbox';var add=document.createElement('button');add.className='add';add.textContent='+';var sug=document.createElement('div');sug.className='suggestions';add.onclick=function(){add.classList.add('hidden');sug.classList.add('open');var last=scenarios[0];sug.innerHTML='';[[-5000,-10000,-20000,5000,10000,20000],[-1,-3,-6,1,3,6],[-0.10,-0.05,0.05,0.10]].forEach(function(row,k){var line=document.createElement('div');line.className='suggest-row';row.forEach(function(delta){var b=document.createElement('button');b.textContent=k===0?money(last.a+delta):k===1?(last.t+delta)+' AY':'%'+(last.r+delta).toFixed(2).replace('.',',');b.dataset.k=k;b.dataset.delta=delta;line.appendChild(b)});sug.appendChild(line)});};addbox.appendChild(add);addbox.appendChild(sug);root.appendChild(addbox)};document.addEventListener('click',function(e){var f=e.target.closest('.field');if(f){open=f.dataset.i+f.dataset.type;document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open')});var card=f.closest('.card');card.querySelector('.panel').classList.add('open');return}var rem=e.target.closest('[data-remove]');if(rem){scenarios.splice(Number(rem.dataset.remove),1);if(!scenarios.length)scenarios.push({a:100000,t:24,r:2.99});render();return}var sg=e.target.closest('.suggest-row button');if(sg){var last=scenarios[scenarios.length-1],n={a:last.a,t:last.t,r:last.r},d=Number(sg.dataset.delta),k=Number(sg.dataset.k);if(k===0)n.a=Math.max(5000,last.a+d);if(k===1)n.t=Math.max(1,last.t+d);if(k===2)n.r=Math.max(0.01,Number((last.r+d).toFixed(2)));scenarios.push(n);render();document.querySelectorAll('.add').forEach(function(b){b.style.display='block'});return}var b=e.target.closest('.panel button');if(b){var s=scenarios[Number(b.dataset.i)],v=Number(b.dataset.value);s[b.dataset.type]=v;render();return}if(!e.target.closest('.card')){open=null;document.querySelectorAll('.panel').forEach(function(p){p.classList.remove('open')});document.querySelectorAll('.add').forEach(function(b){b.style.display='block'})}});render();</script>
